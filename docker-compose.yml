services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: refunddesk
      POSTGRES_USER: refunddesk
      POSTGRES_PASSWORD: refunddesk
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refunddesk -d refunddesk"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - refunddesk_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://refunddesk:refunddesk@db:5432/refunddesk}
      USE_DATABASE: ${USE_DATABASE:-true}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-admin-demo-token}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  refunddesk_pgdata:
